[options]
; =============================================================================
; SolarFlow 360 — Odoo Configuration
; =============================================================================

; --- Database ---
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo_secure_pw
db_name = solarflow
db_maxconn = 64
db_template = template0

; --- Paths ---
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; --- Server ---
http_port = 8069
longpolling_port = 8072
proxy_mode = False
workers = 0

; --- Security ---
admin_passwd = admin
list_db = True
server_wide_modules = base,web

; --- Logging ---
log_level = info
log_handler = :INFO
; logfile = /var/log/odoo/odoo-server.log
; logrotate = True

; --- Performance ---
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = -1

; --- Demo data ---
without_demo = all
